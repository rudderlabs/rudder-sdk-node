version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'quarterly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'github_actions'
    open-pull-requests-limit: 2
    groups:
      github-actions-security-non-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      github-actions-security-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'major'

      github-actions-version-non-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      github-actions-version-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/examples/*'
    schedule:
      interval: 'quarterly'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    open-pull-requests-limit: 4
    groups:
      npm-security-non-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-security-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'major'

      npm-development-non-major:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-development-major:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'major'

      npm-production-non-major:
        applies-to: 'version-updates'
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-production-major:
        applies-to: 'version-updates'
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'major'
