version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      exclude:
        - 'rudderlabs/*'
    labels:
      - 'dependencies'
      - 'github_actions'
    open-pull-requests-limit: 10
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
      github-actions-version-non-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      github-actions-version-major:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      exclude:
        - '@rudderlabs/*'
        - '@rudderstack/*'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 10
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-development-non-major:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-development-major:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'major'

      npm-production-non-major:
        applies-to: 'version-updates'
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-production-major:
        applies-to: 'version-updates'
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'npm'
    directory: '/examples/async-flush'
    schedule:
