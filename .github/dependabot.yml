        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-development-major:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'major'

      npm-production-non-major:
        applies-to: 'version-updates'
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-production-major:
        applies-to: 'version-updates'
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'npm'
    directory: '/examples/custom-axios'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      exclude:
        - '@rudderlabs/*'
