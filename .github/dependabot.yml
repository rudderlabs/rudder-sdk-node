version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '1 0 * * 3'
      timezone: 'UTC'
    # Applies only if routine version updates are re-enabled; security updates
    # are intentionally not delayed by Dependabot cooldowns.
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'github_actions'
      - 'security_updates'
    # Disable routine version updates while retaining security updates.
    open-pull-requests-limit: 0
    groups:
      github-actions-security-non-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      github-actions-security-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'major'

  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/examples/*'
    schedule:
      interval: 'cron'
      cronjob: '1 0 * * 3'
      timezone: 'UTC'
    # Applies only if routine version updates are re-enabled; security updates
    # are intentionally not delayed by Dependabot cooldowns.
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
      - 'security_updates'
    # Disable routine version updates while retaining security updates.
    open-pull-requests-limit: 0
    groups:
      npm-security-non-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      npm-security-major:
        applies-to: 'security-updates'
        patterns:
          - '*'
        update-types:
          - 'major'
