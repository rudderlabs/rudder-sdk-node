name: Node PR candidate E2E

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [master]

permissions: {}

jobs:
  candidates:
    name: Select open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidates: ${{ steps.select.outputs.candidates }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout trusted gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Select event PR or all open PRs after a base update
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/node_candidate_gate.py list

  validate:
    name: Validate PR candidate
    needs: candidates
    if: needs.candidates.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: ${{ fromJSON(needs.candidates.outputs.candidates) }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout trusted gate code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - name: Select current merge candidate
        id: candidate
        env:
          PR_NUMBER: ${{ matrix.candidate.number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/node_candidate_gate.py select
      - name: Create a central validation token
        if: steps.candidate.outputs.eligible == 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: rudder-sdk-e2e-tests
          permission-actions: write
      - name: Validate the isolated PR merge candidate
        if: steps.candidate.outputs.eligible == 'true'
        id: e2e
        uses: rudderlabs/github-action-sdk-e2e@4932729bffd737fc92f9cbed32115b2621da2bcd # reviewed explicit PR inputs (#11)
        with:
          token: ${{ steps.token.outputs.token }}
          suite: reliability
          pr-number: ${{ matrix.candidate.number }}
          merge-sha: ${{ steps.candidate.outputs.sha }}
      - name: Recheck candidate after validation
        if: steps.e2e.outcome == 'success'
        id: completed
        env:
          PR_NUMBER: ${{ matrix.candidate.number }}
          EVENT_SHA: ${{ steps.candidate.outputs.sha }}
          VALIDATED_SHA: ${{ steps.candidate.outputs.sha }}
          VALIDATION_RUN: ${{ steps.e2e.outputs.run-id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/node_candidate_gate.py completed
      - name: Publish candidate status
        if: always() && steps.candidate.outputs.sha != ''
        env:
          PR_NUMBER: ${{ matrix.candidate.number }}
          EVENT_SHA: ${{ steps.candidate.outputs.sha }}
          PR_AUTHOR: ${{ steps.candidate.outputs.author }}
          HEAD_REPO: ${{ steps.candidate.outputs.head-repo }}
          VALIDATION_RESULT: ${{ steps.e2e.outcome }}
          VALIDATED_SHA: ${{ steps.completed.outputs.sha }}
          VALIDATION_RUN: ${{ steps.e2e.outputs.run-url }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/node_candidate_gate.py pr
