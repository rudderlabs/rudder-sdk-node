name: Deploy to NPM

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  sdk-e2e:
    # Validate the exact release-event commit before npm publication.
    if: ${{ !github.event.release.prerelease && !github.event.release.draft && startsWith(github.event.release.tag_name, 'v') && github.ref == format('refs/tags/{0}', github.event.release.tag_name) }}
    uses: ./.github/workflows/server-sdk-e2e.yml
    with:
      suite: full
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  deploy-tag:
    name: Deploy to NPM
    needs: sdk-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout the release commit
      id-token: write # npm trusted publishing with provenance
    outputs:
      version: ${{ steps.release.outputs.version }}
      source-sha: ${{ steps.release.outputs.source-sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # verify the release commit belongs to master
          persist-credentials: false

      - name: Verify release identity
        id: release
        env:
          RELEASE_EVENT_PATH: ${{ github.event_path }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # The release tag is validated before expanding it to a version.
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          RELEASE_VERSION="${RELEASE_TAG#v}" python3 scripts/verify-release.py

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false # never build published artifacts from a PR-writable cache

      - name: Build files
        env:
          HUSKY: 0
        run: |
          npm ci
          npm run package

      - name: Check packaged version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node -e 'const p = require("./dist/package.json"); if (p.name !== "@rudderstack/rudder-sdk-node" || p.version !== process.env.RELEASE_VERSION) process.exit(1)'

      - name: Publish package to NPM
        env:
          HUSKY: 0
        run: |
          cd dist
          npm publish

  registry-acceptance:
    name: Wait for exact npm package
    needs: deploy-tag
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Verify public npm registry propagation
        env:
          RELEASE_VERSION: ${{ needs.deploy-tag.outputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Invalid published package version' >&2
            exit 1
          fi
          for attempt in {1..20}; do
            if observed=$(npm view "@rudderstack/rudder-sdk-node@$RELEASE_VERSION" version --registry=https://registry.npmjs.org --fetch-retries=0 2>/dev/null) && [[ "$observed" == "$RELEASE_VERSION" ]]; then
              echo "Exact npm package $RELEASE_VERSION is available"
              exit 0
            fi
            sleep 15
          done
          echo "Published npm package $RELEASE_VERSION did not propagate in time" >&2
          exit 1

  published-e2e:
    name: Full published-package E2E
    needs: [deploy-tag, registry-acceptance]
    uses: ./.github/workflows/server-sdk-e2e.yml
    with:
      suite: full
      package-version: ${{ needs.deploy-tag.outputs.version }}
      source-sha: ${{ needs.deploy-tag.outputs.source-sha }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  release-complete:
    name: Announce accepted release
    needs: [deploy-tag, registry-acceptance, published-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Send release-complete message to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        env:
          RELEASE_VERSION: ${{ needs.deploy-tag.outputs.version }}
        with:
          method: chat.postMessage
          payload-templated: true
          retries: rapid
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "*New Release: Node.js SDK - v${{ env.RELEASE_VERSION }}*\nPublished to npm and full published-package E2E accepted.\nhttps://github.com/rudderlabs/rudder-sdk-node/releases/tag/v${{ env.RELEASE_VERSION }}\nCC: <!subteam^S0555JBV36D> <!subteam^S03SHJ20350>"
            }

  acceptance-failed:
    name: Report published but not accepted
    needs: [deploy-tag, registry-acceptance, published-e2e, release-complete]
    if: ${{ always() && needs.deploy-tag.result == 'success' && (needs.registry-acceptance.result != 'success' || needs.published-e2e.result != 'success' || needs.release-complete.result != 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Notify Slack about published-but-unaccepted release
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        env:
          RELEASE_VERSION: ${{ needs.deploy-tag.outputs.version }}
        with:
          method: chat.postMessage
          payload-templated: true
          retries: rapid
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": ":warning: Node.js SDK v${{ env.RELEASE_VERSION }} was *published to npm but NOT accepted*. Registry/full E2E or release notification failed. The package cannot be rolled back by CI. Inspect this release run; retry only the validation-only workflow."
            }
      - name: Fail release acceptance visibly
        env:
          RELEASE_VERSION: ${{ needs.deploy-tag.outputs.version }}
        run: |
          echo "::error::npm v${RELEASE_VERSION} was published but registry/full E2E acceptance or release notification FAILED. The package remains published; retry validation only."
          echo "## Published but NOT accepted: v${RELEASE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          exit 1
