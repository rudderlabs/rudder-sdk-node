name: Deploy to NPM

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  id-token: write # allows the JWT to be requested from GitHub's OIDC provider
  contents: read # This is required for actions/checkout

jobs:
  validate-ref:
    name: Require an exact release ref
    if: github.event.release.prerelease != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check the selected tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]] ||
             [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Publication requires an existing stable release tag. Use published-sdk-e2e.yml to retry validation.' >&2
            exit 1
          fi

  sdk-e2e:
    needs: validate-ref
    # Validate the exact release-event commit before npm publication.
    if: startsWith(github.ref, 'refs/tags/v') && github.event.release.prerelease != true
    permissions:
      contents: read
    uses: ./.github/workflows/server-sdk-e2e.yml
    with:
      suite: full
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  deploy-tag:
    name: Deploy to NPM
    needs: sdk-e2e
    outputs:
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    # Skip prereleases so they never publish to npm's default `latest` dist-tag.
    if: startsWith(github.ref, 'refs/tags/v') && github.event.release.prerelease != true
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Validate the exact release version
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {version} = require('./package.json');
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version) ||
              process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match the exact stable package version');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS

      - name: Build files
        env:
          HUSKY: 0
        run: |
          npm ci
          npm run package

      - name: Publish package to NPM
        env:
          HUSKY: 0
        run: |
          cd dist
          npm publish

  published-e2e:
    name: Accept exact published package
    needs: deploy-tag
    permissions:
      contents: read
    uses: ./.github/workflows/published-sdk-e2e.yml
    with:
      package-version: ${{ needs.deploy-tag.outputs.version }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}

  notify-slack:
    name: Report npm release acceptance
    if: ${{ always() && needs.deploy-tag.result == 'success' }}
    needs: [deploy-tag, published-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CURRENT_VERSION_VALUE: ${{ needs.deploy-tag.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Record publication and acceptance separately
        env:
          ACCEPTANCE_RESULT: ${{ needs.published-e2e.result }}
        run: |
          echo "npm publication succeeded. Published-package E2E: $ACCEPTANCE_RESULT." >> "$GITHUB_STEP_SUMMARY"
          echo 'The package remains published if acceptance fails. Retry published-sdk-e2e.yml at the same release tag.' >> "$GITHUB_STEP_SUMMARY"
      - name: Set notification date
        run: echo "DATE=$(date)" >> "$GITHUB_ENV"

      - name: Send message to Slack channel
        if: needs.published-e2e.result == 'success'
        id: slack
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        env:
          PROJECT_NAME: 'Node.js SDK'
          NPM_PACKAGE_URL: 'https://www.npmjs.com/package/@rudderstack/rudder-sdk-node'
          RELEASES_URL: 'https://github.com/rudderlabs/rudder-sdk-node/releases/tag/v'
        with:
          method: chat.postMessage
          payload-templated: true
          retries: rapid
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "text": "*New Release: ${{ env.PROJECT_NAME }} - <${{ env.NPM_PACKAGE_URL }}|${{ env.CURRENT_VERSION_VALUE }}>*\n${{ env.DATE }}\nCC: <!subteam^S0555JBV36D> <!subteam^S03SHJ20350>",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "New Release: ${{ env.PROJECT_NAME }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*<${{ env.NPM_PACKAGE_URL }}|v${{ env.CURRENT_VERSION_VALUE }}>*\n${{ env.DATE }}\nCC: <!subteam^S0555JBV36D> <!subteam^S03SHJ20350>"
                  },
                  "accessory": {
                    "type": "image",
                    "image_url": "https://img.icons8.com/color/452/npm.png",
                    "alt_text": "NPM Icon"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "For more details, check the full release notes <${{ env.RELEASES_URL }}${{ env.CURRENT_VERSION_VALUE }}|here>."
                    }
                  ]
                }
              ]
            }
